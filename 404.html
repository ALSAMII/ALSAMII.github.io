<style>

    margin: 0;
    min-height: 100svh;
    display: grid;
    place-items: center;
    background: #0b0907;

    text-align: center;

    font-size: 0.6875rem;
    letter-spacing: 0.28em;
    text-transform: uppercase;
    color: #c79a5e;
  }
  h1 {
    font-family: "Cormorant Garamond", serif;
    font-weight: 500;

    line-height: 1.2;
    margin: 1.25rem 0;
  }
  p { color: #8d8371; max-width: 26rem; margin: 0 auto 2.5rem; }
  a {
    color: #c79a5e;
    text-decoration: none;
    border-bottom: 1px solid rgba(199, 154, 94, 0.55);
    padding-bottom: 0.2rem;
  }
  a:hover { color: #d8d0c0; border-bottom-color: #d8d0c0; }
  .flame {
    width: 14px; height: 22px; margin: 0 auto 1.5rem;
    background: #ffd9a0;
    border-radius: 50% 50% 50% 50% / 62% 62% 38% 38%;
    box-shadow: 0 0 34px 10px rgba(199, 154, 94, 0.3);
  }
</style>

<body>
<main>
  <div class="flame" aria-hidden="true"></div>
