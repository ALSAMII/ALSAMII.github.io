<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 1000" preserveAspectRatio="xMidYMid slice">
  <defs>
    <radialGradient id="fog" cx="0.5" cy="0.4" r="0.65">
      <stop offset="0"   stop-color="#9aa88e" stop-opacity="0.46"/>
      <stop offset="0.45" stop-color="#5c6a52" stop-opacity="0.24"/>
      <stop offset="1"   stop-color="#5c6a52" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="lanternGlow" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0"   stop-color="#ffc879" stop-opacity="0.55"/>
      <stop offset="0.5" stop-color="#e09a4e" stop-opacity="0.18"/>
      <stop offset="1"   stop-color="#e09a4e" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="candleGlow" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0"    stop-color="#ffca80" stop-opacity="0.58"/>
      <stop offset="0.45" stop-color="#d98f3f" stop-opacity="0.20"/>
      <stop offset="1"    stop-color="#d98f3f" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="deerHalo" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0" stop-color="#cddabf" stop-opacity="0.40"/>
      <stop offset="1" stop-color="#cddabf" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="sky" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#141811"/>
      <stop offset="1" stop-color="#0a0c08"/>
    </linearGradient>
    <linearGradient id="wall" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#0f0c08"/>
      <stop offset="1" stop-color="#070504"/>
    </linearGradient>
    <linearGradient id="floor" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#0e0a07"/>
      <stop offset="1" stop-color="#050403"/>
    </linearGradient>
    <linearGradient id="mist" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#8b9a7e" stop-opacity="0"/>
      <stop offset="1" stop-color="#8b9a7e" stop-opacity="0.24"/>
    </linearGradient>
    <linearGradient id="shelfShade" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#060403" stop-opacity="0.85"/>
      <stop offset="1" stop-color="#060403" stop-opacity="0.1"/>
    </linearGradient>
    <linearGradient id="shelfWarm" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#d98f3f" stop-opacity="0.10"/>
      <stop offset="0.6" stop-color="#d98f3f" stop-opacity="0"/>
    </linearGradient>
    <radialGradient id="vignette" cx="0.47" cy="0.42" r="0.85">
      <stop offset="0"    stop-color="#060404" stop-opacity="0"/>
      <stop offset="0.55" stop-color="#060404" stop-opacity="0.25"/>
      <stop offset="1"    stop-color="#060404" stop-opacity="0.92"/>
    </radialGradient>
    <filter id="softer" x="-40%" y="-40%" width="180%" height="180%">
      <feGaussianBlur stdDeviation="14"/>
    </filter>
  </defs>

  <!-- room -->
  <rect width="1600" height="1000" fill="url(#wall)"/>

