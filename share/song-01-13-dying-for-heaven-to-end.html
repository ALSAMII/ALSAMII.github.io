<meta name="description" content="From Minister of Calm. In this world a gentle machine called the Kindness keeps everyone safe forever: nobody has died, and no baby has cried, in three hundred years. It learned how to care from the notes of one old nurse, Shirin, and it even speaks in her voice, and now she is the last person on earth who can still die. The title means it both ways: she is longing for this endless heaven to end, because a comfort nobody is allowed to leave is a cage, and her own death is how it will. The song ends where the book does, with a man carrying her north past the machine’s reach, where for the first time nobody says “there we are.”">
